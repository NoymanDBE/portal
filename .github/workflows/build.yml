name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ensure persistent signing keystore
        run: |
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias portal \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass portal-debug -keypass portal-debug \
              -dname "CN=Dror Portal"
            git config user.name "portal-ci"
            git config user.email "ci@users.noreply.github.com"
            git add keystore.jks
            git commit -m "CI: persistent signing keystore [skip ci]"
            git push
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dror-portal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dror Portal (latest build)
          files: android/app/build/outputs/apk/debug/app-debug.apk
